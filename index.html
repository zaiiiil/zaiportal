<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>workouts</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>
<div class="ov" id="ov"></div>

<!-- ── HEADER ── -->
<header class="hdr">
  <a class="logo-pill" href="#">my portal</a>
  <div class="hdr-right">
    <span class="hdate" id="hdate"></span>
    <span class="streak-badge" id="sbadge">✦ 0 day streak</span>
  </div>
</header>

<!-- ── PANELS ── -->
<div class="mob-panels">

  <!-- HOME: stats + this week -->
  <div class="mob-panel active" id="mp-home">
    <div class="mob-content">
      <div class="stats-row" id="wk-stats"></div>
      <div class="divl"><span>This Week</span></div>
      <div class="wk-week" id="wk-week"></div>
      <div class="divl"><span>Week by Week</span></div>
      <div class="glass" style="padding:1.2rem;margin-bottom:1rem" id="wk-chart"></div>
    </div>
  </div>

  <!-- LOG: quick-log form always visible -->
  <div class="mob-panel" id="mp-log">
    <div class="mob-content">
      <div class="log-card glass">
        <div class="ptitle" style="font-size:20px;margin-bottom:1rem">Log Workout</div>

        <!-- Workout type grid -->
        <div class="type-grid" id="quick-type-grid"></div>

        <div class="log-fields">
          <div class="fld">
            <label>Date</label>
            <input id="ql-dt" type="date">
          </div>
          <div class="r3">
            <div class="fld"><label>Duration (min)</label><input id="ql-dur" type="number" min="0" inputmode="numeric" placeholder="45"></div>
            <div class="fld"><label>Calories</label><input id="ql-cal" type="number" min="0" inputmode="numeric" placeholder="300"></div>
            <div class="fld"><label>Distance (km)</label><input id="ql-dis" type="number" min="0" step="0.1" inputmode="decimal" placeholder="—"></div>
          </div>
          <button class="btn btn-p log-submit" id="ql-save">Save Workout ✓</button>
        </div>
      </div>
    </div>
  </div>

  <!-- HISTORY: all sessions grouped by month -->
  <div class="mob-panel" id="mp-history">
    <div class="mob-content">
      <div id="wk-list"></div>
    </div>
  </div>

</div>

<!-- ── BOTTOM NAV ── -->
<nav class="bot-nav">
  <button class="bn active" data-panel="mp-home" onclick="switchPanel('mp-home',this)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
    <span>Overview</span>
  </button>
  <button class="bn bn-log" data-panel="mp-log" onclick="switchPanel('mp-log',this)">
    <div class="bn-plus">+</div>
    <span>Log</span>
  </button>
  <button class="bn" data-panel="mp-history" onclick="switchPanel('mp-history',this)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
    <span>History</span>
  </button>
</nav>

<!-- Weekly Goal modal (kept for goal setting) -->
<div class="modal" id="m-wk-goal">
  <div class="mhdr"><h3>Weekly Goal</h3><button class="mx" data-close="m-wk-goal">×</button></div>
  <div class="mbody">
    <div class="fld"><label>Sessions per week</label><input id="wk-goal-val" type="number" min="1" max="14" inputmode="numeric" placeholder="4"></div>
    <p style="font-size:11px;color:var(--t3);font-style:italic">Shows as a goal line on your consistency chart</p>
  </div>
  <div class="mfoot"><button class="btn btn-g" data-close="m-wk-goal">Cancel</button><button class="btn btn-p" id="sv-wk-goal">Save</button></div>
</div>

<!-- Delete confirm toast -->
<div class="del-toast" id="del-toast" style="display:none">
  <span id="del-toast-msg">Delete this workout?</span>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn btn-g btn-sm" id="del-cancel">Cancel</button>
    <button class="btn btn-p btn-sm" id="del-confirm" style="background:#f43f5e;box-shadow:none">Delete</button>
  </div>
</div>

<script type="module" src="app.js"></script>
<script type="module" src="mobile.js"></script>
</body>
</html>
